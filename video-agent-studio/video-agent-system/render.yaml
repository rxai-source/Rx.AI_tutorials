services:
  - type: web
    name: video-agent-studio
    env: docker
    dockerfilePath: ./video-agent-studio/video-agent-system/Dockerfile
    dockerContext: ./video-agent-studio/video-agent-system
    plan: standard
    healthCheckPath: /mcp_healthcheck
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAULT_TTS_MODEL
        value: gtts
      - key: DEFAULT_TTS_VOICE
        value: en
