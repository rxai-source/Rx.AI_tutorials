name: boardroom_app
description: "A production-grade Flutter application for Rx.AI Boardroom Writers room."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: any
  hooks_riverpod: any
  flutter_hooks: any
  google_fonts: any
  flutter_svg: ^2.0.10
  flutter_highlighter: any
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
