[project]
name = "video-agent-system"
version = "0.1.0"
description = "Agentic Video Production System with FastMCP Tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "fastmcp>=0.1.0",
    "gtts>=2.5.0",
    "edge-tts>=7.0.0",
    "pyttsx3>=2.90",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.20.0",
    "langgraph>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
